name: ci

on:
  push:
    branches: [main]
    # v* is the v0.0.x deploy counter; module-package/v* is the independent
    # immutable-package release track keyed to module.package.codefly.yaml.
    tags: ["v*", "module-package/v*"]
  pull_request:
    branches: [main]
  # The merge queue builds each entry as `main + the PR` and reports the
  # required checks from THAT ref, which is the guarantee "require branches to
  # be up to date" was buying by making every author rebase by hand. Every
  # context the ruleset requires must therefore also run here, or a queued PR
  # waits forever on a check that never reports and is dropped from the queue.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request's run is free; superseding a merge-queue entry,
  # a main push or a release tag is not. A cancelled merge_group run never
  # reports its required checks, which stalls the queue and evicts the entry.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  base-integrity:
    name: Base manifest integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test the base-integrity guard
        run: node --test module/tools/base-integrity.test.mjs
      - name: Test the RLS migration gate
        run: node --test module/tools/rls-migration-gate.test.mjs
      - name: Verify managed baseline provenance and explicit source selection
        run: python3 -m unittest discover -s qualification/managed-database -p 'test_*.py'
      - name: Test the migration pairing gate
        run: node --test module/tools/migration-pairing-gate.test.mjs
      - name: Test the migration reference gate
        run: node --test module/tools/migration-reference-gate.test.mjs
      - name: Test the test-target catalog gate
        run: node --test module/tools/test-targets-gate.test.mjs
      - name: Validate migration history against the merge reference
        id: migration-reference
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
        run: node module/tools/migration-reference-gate.mjs "$MIGRATION_BASE"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.migration-reference.outputs.replay == 'true'
        with:
          go-version: "1.27.0"
          cache-dependency-path: module/services/store/code/go.sum
      - name: Verify migration upgrade and clean install on PostgreSQL
        if: steps.migration-reference.outputs.replay == 'true'
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
        run: node module/tools/migration-reference-gate.mjs "$MIGRATION_BASE" --replay
      - name: Test the generated-pins gate
        run: node --test module/tools/generated-pins-gate.test.mjs
      - name: Test the naming gate
        run: node --test module/tools/naming-gate.test.mjs
      - name: Verify the shipped manifest matches the canonical tree
        run: node module/tools/base-integrity.mjs verify
      - name: Enforce tenant RLS coverage in store migrations
        run: node module/tools/rls-migration-gate.mjs check
      - name: Enforce up+down pairing across all migrations
        run: node module/tools/migration-pairing-gate.mjs check
      - name: Validate every service test-target catalog
        run: node module/tools/test-targets-gate.mjs check
      # Fails fast and by name on generated Go that no pinned run reproduces,
      # instead of letting Codefly's sync-drift phase report it late as an
      # opaque byte diff that blocks the gate on every open PR.
      - name: Enforce pinned plugin versions and shape on checked-in generated Go
        run: node module/tools/generated-pins-gate.mjs check
      # This repository is public and sits BELOW its consumers in the dependency graph, so a
      # real consumer, customer or product name in the tree is a leak and an inverted
      # dependency at once. AGENTS.md has forbidden it since day one; nothing enforced it,
      # and ~380 violating lines accumulated across 68 files before this gate existed.
      - name: Enforce generic placeholder names across the tree
        run: node module/tools/naming-gate.mjs check

  authz-coverage:
    name: Authorization coverage
    runs-on: ubuntu-latest
    # Kept at 15: this job now also boots a PostgreSQL service and runs the
    # scoped-audit suite under -race, so it does strictly more work than when
    # 15 was set. Lowering it to 10 alongside that addition was a timeout flake
    # waiting to happen.
    timeout-minutes: 15
    services:
      audit-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: audit-test-only
          POSTGRES_DB: audit_metrics
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d audit_metrics"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # no-broadening diffs the catalog against main.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test the authz-coverage gate
        run: node --test module/tools/authz-coverage-gate.test.mjs
      - name: Enforce RBAC and audit coverage
        run: node module/tools/authz-coverage-gate.mjs check
      - name: Reject permission-broadening without approval
        if: github.event_name == 'pull_request'
        env:
          # Renders to "false" when the label is absent; the gate requires an
          # affirmative token, so only the label opens the escape hatch.
          AUTHZ_ALLOW_BROADENING: ${{ contains(github.event.pull_request.labels.*.name, 'authz-broadening-approved') }}
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          base="$(mktemp)"
          if git show origin/main:module/services/accounts/generated/authz-methods.json > "${base}" 2>/dev/null; then
            node module/tools/authz-coverage-gate.mjs no-broadening --base "${base}"
          else
            echo "no authorization catalog on main yet; nothing to diff"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.sum
            module/tools/go.sum
            module/services/*/code/go.sum
      - name: Enforce the sidecar header-lockstep invariant
        working-directory: module/services/auth-gateway/code
        run: go test -run TestUntrustedHeaders_SupersetOfStampedHeaders .
      - name: Enforce the declared-policy -> handler-enforcement lockstep
        working-directory: module/services/accounts/code
        run: go test -run 'Lockstep|RequiredCapabilities|ScanHandlers|EnforcementAllowlist' ./pkg/adapters/
      - name: Qualify managed database install, upgrade and role boundaries
        run: |
          docker pull postgres@sha256:fe03a7605299a34ddf5e4f285dff78c3d7190a576b3c6b46f2fcff69f4bffd54
          python3 qualification/managed-database/ci.py /tmp/managed-database-qualification.json
      - name: Verify scoped audit SQL and current resource authority
        working-directory: module/services/accounts/code
        env:
          AUDIT_METRICS_REQUIRE_DB: "1"
          AUDIT_METRICS_TEST_DSN: postgres://postgres:audit-test-only@127.0.0.1:${{ job.services.audit-postgres.ports[5432] }}/audit_metrics?sslmode=disable
        run: go test -race ./internal/auditmetricstest

  release-contract:
    name: Release gate contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test the release-gate contract
        run: node --test scripts/ci/release-gates.test.mjs scripts/ci/ci-performance.test.mjs
      - name: Test the release announcement
        run: node --test scripts/ci/announce-release.test.mjs
      - name: Test the dependabot coverage gate
        run: node --test scripts/ci/dependabot-coverage.test.mjs scripts/ci/build-images.test.mjs
      - name: Require every artifact-writing job to depend on the release gates
        run: node scripts/ci/release-gates.mjs check
      # A Dependabot entry over a base-tracked manifest opens a pull request that
      # can never merge — the bump leaves base-manifest.json stale, base-integrity
      # fails, and Dependabot cannot run `base-integrity.mjs gen` — which then
      # consumes the ecosystem's open-pull-requests-limit indefinitely.
      - name: Require dependabot to cover every updatable manifest and no base file
        run: |
          node scripts/ci/dependabot-coverage.mjs check
          node scripts/ci/build-images.mjs check

  docs-sync:
    name: Interface docs and story tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test the interface-docs gate
        run: node --test module/tools/interface-docs-gate.test.mjs
      - name: Test the story-trace gate
        run: node --test module/tools/story-trace-gate.test.mjs
      - name: Require a readable summary on every public operation
        run: node module/tools/interface-docs-gate.mjs check
      - name: Require every story test to be present and to run
        # The comparison against the functional page needs that page, which
        # this repository has no credentialed way to read and, by AGENTS.md,
        # may not name. It runs where the page and this tree sit together — a
        # composed workspace pins this module by tag and holds both. What runs
        # here is the half that needs nothing external, and the step claims
        # only that.
        run: node module/tools/story-trace-gate.mjs tests

  kit-version:
    name: Frontend kit version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The gate reads the newest release tag as the baseline of what the
      # registry serves, so it needs the tags and the history between them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test the kit-version gate
        run: node --test scripts/ci/kit-version.test.mjs
      - name: Require a version bump when the published kit changes
        run: node scripts/ci/kit-version.mjs check

  provider-shim:
    name: Provider setup shims
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Statically test the Stripe non-writing shim
        run: node --test scripts/setup/stripe-shim.test.mjs

  marketing:
    name: Marketing isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: module/services/marketing/code/package-lock.json
      - name: Validate public configuration generator
        run: |
          node --test module/tools/generate-public-config.test.mjs
          node module/tools/generate-public-config.mjs --check
      - name: Build marketing in an isolated context
        run: node module/tools/marketing-extraction.mjs

  sdk-boundary:
    name: Codefly SDK boundary
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.sum
            module/tools/go.sum
            module/services/*/code/go.sum
            libraries/execution-custody-sdk/go/go.sum
      - name: Validate module agent
        env:
          GOWORK: "off"
        run: go test ./...
      - name: Test source-read SDK and production authority boundary
        env:
          GOWORK: "off"
        run: |
          (cd libraries/source-read-sdk/go && go test ./... && go vet ./...)
          bash scripts/ci/test-source-read.sh
      - name: Test private custody SDK conformance
        working-directory: libraries/execution-custody-sdk/go
        env:
          GOWORK: "off"
        run: |
          go mod verify
          go test -race ./...
          go vet ./...
      - name: Reject direct Codefly runtime-carrier access
        working-directory: module/tools
        env:
          GOWORK: "off"
        run: go test codefly_sdk_boundary_test.go
      - name: Enforce deterministic protocol generation
        working-directory: module/tools
        env:
          GOWORK: "off"
        run: go test -run TestMergedProtocolGeneratorsUseOneInvocation .
      - name: Install Codefly
        run: bash scripts/ci/install-codefly.sh
      - name: Check exported API contracts are in sync with the proto
        run: codefly generate contracts saas-starter --check

  module-package:
    name: Immutable module package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: module/tools/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: module/services/frontend/code/package-lock.json
      # The token is not Buf credentials: the action resolves the buf release
      # through the GitHub REST API, and an anonymous call is rated against the
      # runner's egress IP, which every GitHub-hosted runner shares. Passing it
      # moves the call onto this repository's own limit so a hot shared pool
      # cannot fail this job before any repository logic runs.
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.72.0
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the Python settings runtime
        working-directory: module/services/accounts/code/python
        run: python3 -m pip install --quiet ".[test]"
      - name: Clean-install frontend dependencies
        run: npm ci --prefix module/services/frontend/code
      - name: Validate the package contract
        working-directory: module/tools
        env:
          GOWORK: "off"
        run: |
          go test ./...
          go run ./cmd/module-package validate --module ..
      - name: Reject breaking stable protobuf changes
        shell: bash
        run: |
          baseline="$(mktemp -d)"
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          git archive origin/main module/services/accounts/proto | tar -x -C "${baseline}"
          buf breaking module/services/accounts/proto \
            --against "${baseline}/module/services/accounts/proto" \
            --exclude-imports
      - name: Execute declared generators and reject drift
        working-directory: module/tools
        env:
          GOWORK: "off"
        run: |
          go run ./cmd/module-package run-generators --module ..
          git -C ../.. diff --exit-code -- module
      - name: Execute published contract conformance suites
        working-directory: module/tools
        env:
          GOWORK: "off"
        run: |
          go run ./cmd/module-package run-conformance --module ..
          npm --prefix ../services/frontend/code run test:published-plugin-contract
      - name: Prove canonical archive determinism
        working-directory: module/tools
        env:
          GOWORK: "off"
        run: |
          first="${RUNNER_TEMP}/module-package-first"
          second="${RUNNER_TEMP}/module-package-second"
          go run ./cmd/module-package build \
            --repository-root ../.. \
            --output "${first}" \
            --commit "${GITHUB_SHA}"
          go run ./cmd/module-package build \
            --repository-root ../.. \
            --output "${second}" \
            --commit "${GITHUB_SHA}"
          cmp "${first}/module.tar" "${second}/module.tar"
          cmp "${first}/module.tar.sha256" "${second}/module.tar.sha256"
          cmp "${first}/artifact.json" "${second}/artifact.json"

  # Resolve Codefly's affected-scoping once and fan the gate out into three
  # parallel jobs below. A change with zero affected services (docs, most root
  # config) leaves has_work=false, so every Codefly job is skipped and CI is a
  # near-instant no-op — the same property a downstream consumer sees when it
  # syncs the starter with no local deltas.
  codefly-plan:
    name: Codefly CI plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_work: ${{ steps.plan.outputs.has_work }}
      services: ${{ steps.plan.outputs.services }}
      base: ${{ steps.plan.outputs.base }}
      all: ${{ steps.plan.outputs.all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
      - name: Reject ineffective image proposals before service CI
        env:
          CODEFLY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/ci/build-images.mjs check
      - name: Install Codefly
        run: bash scripts/ci/install-codefly.sh
      - name: Resolve affected services
        id: plan
        shell: bash
        env:
          CODEFLY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          # Pushes to main and release tags verify the full topology; PRs and
          # merge-queue entries scope to the delta against their base — for a
          # queue entry that base is the tip of main the entry was built on, so
          # the delta is exactly what the merge would add. A missing/zero base
          # (first push) also falls back to the full topology. This is the ONLY place the
          # full-vs-delta decision (and the zero-sha normalization) is made;
          # the fan-out jobs consume the `all`/`base` outputs verbatim so the
          # contract cannot drift across the four jobs.
          #
          # A release tag is forced to the full topology from the ref, never
          # from the push payload: `before` is the zero sha only for a NEW tag,
          # so force-moving an existing tag carries the old commit and would
          # otherwise scope the mandatory release gates to a delta — publishing
          # services that were never rebuilt or re-audited for that release.
          release_tag=false
          case "${GITHUB_REF}" in
            refs/tags/v*|refs/tags/module-package/v*) release_tag=true ;;
          esac

          base=""
          all=true
          selection_args=(--head "${GITHUB_SHA}")
          if [[ "${release_tag}" != "true" \
            && -n "${CODEFLY_BASE}" \
            && "${CODEFLY_BASE}" != "0000000000000000000000000000000000000000" ]]; then
            base="${CODEFLY_BASE}"
            all=false
            if git diff --name-only "${base}" "${GITHUB_SHA}" -- scripts/ci/build-images.json | grep -q .; then
              all=true
              selection_args+=(--all)
            else
              selection_args+=(--base "${base}")
            fi
          else
            selection_args+=(--all)
          fi

          plan_json="$(codefly ci plan "${selection_args[@]}" --format json)"
          services="$(jq -r '.services[].service' <<<"${plan_json}" \
            | sed 's#^[^/]*/##' | paste -sd' ' -)"
          count="$(jq -r '.services | length' <<<"${plan_json}")"

          # Never let an empty full-topology plan silence the gate on main/tags.
          has_work=false
          if [[ "${all}" == "true" ]] || (( count > 0 )); then
            has_work=true
          fi

          {
            echo "base=${base}"
            echo "all=${all}"
            echo "services=${services}"
            echo "has_work=${has_work}"
          } >> "${GITHUB_OUTPUT}"

  codefly-quality-phases:
    name: Codefly quality (${{ matrix.phase }})
    needs: codefly-plan
    # Always run on release tags: a release must exercise the full topology
    # whatever the affected-service plan says, and release-gates counts a skip
    # on a tag as a failure rather than as a scoping decision.
    if: ${{ needs.codefly-plan.outputs.has_work == 'true' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/module-package/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase: ["verify,sync-drift", lint, compile, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.sum
            module/tools/go.sum
            module/services/*/code/go.sum
      - name: Cache npm downloads for quality phases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('module/services/*/code/package-lock.json') }}
          restore-keys: |
            npm-quality-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Codefly
        run: bash scripts/ci/install-codefly.sh
      - name: Ensure runner disk space
        if: matrix.phase == 'test'
        run: bash scripts/ci/ensure-disk-space.sh
      - name: Make host.docker.internal resolvable on the Linux runner
        shell: bash
        run: |
          # Codefly's runtime health-checks its test dependencies (redis for
          # cache, postgres for store, …) at host.docker.internal, the
          # name Docker Desktop provides on macOS/Windows. Linux runners do
          # not resolve it on the host, and a runner-image change dropped it,
          # breaking the frontend test phase with
          #   <dep> is not ready: … lookup host.docker.internal … no such host
          # Published dependency ports bind to the host loopback, so map the
          # name there. Idempotent: skip if already present.
          if ! grep -q 'host.docker.internal' /etc/hosts; then
            echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts
          fi
      - name: Run quality phase
        shell: bash
        env:
          CI_PHASE: ${{ matrix.phase }}
          SELECTION_ALL: ${{ needs.codefly-plan.outputs.all }}
          CODEFLY_BASE: ${{ needs.codefly-plan.outputs.base }}
          # Affected services resolved once by codefly-plan; empty on full runs
          # only if the topology has no services.
          AFFECTED_SERVICES: ${{ needs.codefly-plan.outputs.services }}
          # Select the Codefly fixture used by dependency-backed frontend tests.
          # Accounts reads this through the Codefly SDK; application code never
          # reaches into Codefly's runtime carrier directly.
          CODEFLY__FIXTURE: dev-admin
        run: |
          selection_args=(--head "${GITHUB_SHA}")
          if [[ "${SELECTION_ALL}" == "true" ]]; then
            selection_args+=(--all)
          else
            selection_args+=(--base "${CODEFLY_BASE}")
          fi

          if [[ "${CI_PHASE}" == "verify,sync-drift" ]]; then
            codefly ci run "${selection_args[@]}" \
              --phase "${CI_PHASE}" \
              --output .codefly/ci/pre-audit
            exit 0
          fi

          validation_selection_args=()
          for service in ${AFFECTED_SERVICES}; do
            validation_selection_args+=(
              --changed-file "module/services/${service}/service.codefly.yaml"
            )
          done

          if (( ${#validation_selection_args[@]} )); then
            codefly ci run "${validation_selection_args[@]}" \
              --phase "${CI_PHASE}" \
              --output .codefly/ci/validation
          fi

  # Preserve the required check name configured in the repository ruleset.
  codefly-quality:
    name: Codefly quality
    needs: [codefly-plan, codefly-quality-phases]
    if: ${{ !cancelled() && (needs.codefly-plan.outputs.has_work == 'true' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/module-package/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality phase
        env:
          QUALITY_RESULT: ${{ needs.codefly-quality-phases.result }}
        run: test "${QUALITY_RESULT}" = success

  codefly-supply-chain:
    name: Codefly supply chain
    needs: codefly-plan
    # Always run on release tags: a release must exercise the full topology
    # whatever the affected-service plan says, and release-gates counts a skip
    # on a tag as a failure rather than as a scoping decision.
    if: ${{ needs.codefly-plan.outputs.has_work == 'true' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/module-package/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.sum
            module/tools/go.sum
            module/services/*/code/go.sum
      - name: Install Codefly
        run: bash scripts/ci/install-codefly.sh
      # Temporal's amd64 image expands beyond Core's managed 512 MiB Syft
      # scratch volume. A host binary lets Codefly use the runner's disk.
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.50.0
      - name: Ensure runner disk space
        run: bash scripts/ci/ensure-disk-space.sh
      - name: Audit and SBOM
        shell: bash
        env:
          SELECTION_ALL: ${{ needs.codefly-plan.outputs.all }}
          CODEFLY_BASE: ${{ needs.codefly-plan.outputs.base }}
        run: |
          selection_args=(--head "${GITHUB_SHA}")
          if [[ "${SELECTION_ALL}" == "true" ]]; then
            selection_args+=(--all)
          else
            selection_args+=(--base "${CODEFLY_BASE}")
          fi

          # Keep the complete audit in the Codefly evidence report, including
          # vendor runtime images. Those images have their own release cadence
          # and may carry upstream findings that this repository cannot patch.
          # The vulnerability gate below separately fails closed on every
          # first-party service and production frontend dependency.
          #
          # Several published vendor-image agents predate Core's shared Trivy
          # cache lock. Serialize the audit so those independent agent processes
          # cannot corrupt or time out on the same cache.
          codefly ci run "${selection_args[@]}" \
            --phase audit \
            --output .codefly/ci/audit \
            --fail-on-vuln=false \
            --jobs=1

          codefly ci run "${selection_args[@]}" \
            --phase sbom \
            --output .codefly/ci/sbom
      - name: Enforce first-party vulnerability gate
        shell: bash
        run: |
          codefly audit service accounts --outdated=false --fail-on-vuln
          codefly audit service auth-gateway --outdated=false --fail-on-vuln
          npm --prefix module/services/frontend/code audit --omit=dev --audit-level=high
          npm --prefix module/services/marketing/code audit --omit=dev --audit-level=high

  codefly-build:
    name: Codefly build
    needs: codefly-plan
    # Always run on release tags: a release must exercise the full topology
    # whatever the affected-service plan says, and release-gates counts a skip
    # on a tag as a failure rather than as a scoping decision.
    if: ${{ needs.codefly-plan.outputs.has_work == 'true' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/module-package/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            go.sum
            module/tools/go.sum
            module/services/*/code/go.sum
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.33.0
          driver: docker
      - name: Install Codefly
        run: bash scripts/ci/install-codefly.sh
      - name: Ensure runner disk space
        run: bash scripts/ci/ensure-disk-space.sh
      - name: Test executor image evidence against real Docker builds
        env:
          BUILD_IMAGES_DOCKER_TEST: 'true'
        run: node --test scripts/ci/build-images.test.mjs
      - name: Build affected service images
        shell: bash
        env:
          SELECTION_ALL: ${{ needs.codefly-plan.outputs.all }}
          BUILDKIT_PROGRESS: plain
          CODEFLY_BASE: ${{ needs.codefly-plan.outputs.base }}
        run: |
          selection_args=(--head "${GITHUB_SHA}")
          if [[ "${SELECTION_ALL}" == "true" ]]; then
            selection_args+=(--all)
          else
            selection_args+=(--base "${CODEFLY_BASE}")
          fi

          # Build two services concurrently. The standard ubuntu-latest runner
          # is 4 vCPU / 16 GB; disk preparation requires 12 GiB free;
          # each Next.js `next build` is CPU- and memory-hungry, and there are
          # two of them, so a higher fan-out risks an OOM kill or exhausting
          # the disk on a full-topology build. Two at a time keeps the peak
          # within the runner while still ~halving the serialized build time.
          # Raise this in lockstep with a larger runner (see #194 item D).
          jobs=2

          # Concurrent agent builds share the runner's Docker layer store, and
          # the Store agent can still hit a transient export fault — it happened
          # even serially, and running builds in parallel makes the race more
          # likely, so allow a few retries. Retry only that exact daemon error;
          # genuine failures stop at once.
          mkdir -p .codefly/ci
          build_log=".codefly/ci/build.log"
          for attempt in 1 2 3 4 5; do
            node scripts/ci/build-images.mjs snapshot
            if codefly ci run "${selection_args[@]}" \
              --phase build \
              --output ".codefly/ci/build-${attempt}" \
              --jobs "${jobs}" 2>&1 | tee "${build_log}"; then
              break
            fi
            if ! grep -Fq "layer does not exist" "${build_log}" || (( attempt == 5 )); then
              exit 1
            fi
            echo "::warning::Docker lost an image-export layer; syncing and retrying the build"
            sync
          done

      - name: Verify effective build image evidence
        if: ${{ !cancelled() }}
        env:
          SELECTION_ALL: ${{ needs.codefly-plan.outputs.all }}
          AFFECTED_SERVICES: ${{ needs.codefly-plan.outputs.services }}
        run: node scripts/ci/build-images.mjs evidence
      - name: Retain build image evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: effective-build-images
          path: .codefly/ci/
          include-hidden-files: true
          if-no-files-found: error

  # The one aggregate every artifact-writing job below depends on. It runs past
  # a failed dependency so it can read its dependencies' own outcomes: a plain
  # `needs:` cannot tell a check that passed from one that never ran, and a gate
  # that never ran is not consent to publish. `decide` owns that rule, including
  # the single deliberate exemption — the affected-scoped Codefly jobs, which a
  # no-affected-service plan legitimately skips off a release tag.
  #
  # `!cancelled()` rather than `always()`: both reach this job when a gate
  # failed, but a run superseded by `cancel-in-progress` skips it instead of
  # recording a failure nobody should read.
  release-gates:
    name: Release gates
    if: ${{ !cancelled() }}
    needs:
      - authz-coverage
      - base-integrity
      - codefly-build
      - codefly-plan
      - codefly-quality
      - codefly-supply-chain
      - docs-sync
      - kit-version
      - marketing
      - module-package
      - provider-shim
      - release-contract
      - sdk-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Require every mandatory gate to have succeeded
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/release-gates.mjs decide

  publish-module-package:
    name: Publish immutable module package
    # Only the dedicated module-package/v* track publishes the immutable
    # package; the v0.0.x deploy counter never triggers a package release.
    if: startsWith(github.ref, 'refs/tags/module-package/v')
    needs:
      - release-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: module/tools/go.sum
      - name: Reject a mutable or repeated release
        shell: bash
        working-directory: module/tools
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
          GOWORK: "off"
        run: |
          GH_TOKEN="${RELEASE_ADMIN_TOKEN}" gh api \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" > "${RUNNER_TEMP}/immutable-release-settings.json"
          go run ./cmd/module-package verify-release-policy \
            --settings "${RUNNER_TEMP}/immutable-release-settings.json"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists" >&2
            exit 1
          fi
          git ls-remote --tags origin \
            "refs/tags/${GITHUB_REF_NAME}" \
            "refs/tags/${GITHUB_REF_NAME}^{}" > "${RUNNER_TEMP}/remote-refs"
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          go run ./cmd/module-package verify-release-ancestry \
            --repository-root ../.. \
            --commit "${GITHUB_SHA}" \
            --trusted-ref refs/remotes/origin/main
          go run ./cmd/module-package verify-release-ref \
            --module .. \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --remote-refs "${RUNNER_TEMP}/remote-refs"
      - name: Build the canonical package
        working-directory: module/tools
        env:
          GOWORK: "off"
        run: |
          go run ./cmd/module-package build \
            --repository-root ../.. \
            --output "${RUNNER_TEMP}/release" \
            --commit "${GITHUB_SHA}"
      - name: Sign Core module provenance
        shell: bash
        env:
          GOWORK: "off"
          RELEASE_PROVENANCE_PRIVATE_KEY: ${{ secrets.RELEASE_PROVENANCE_PRIVATE_KEY }}
          RELEASE_PROVENANCE_PUBLIC_KEY: ${{ secrets.RELEASE_PROVENANCE_PUBLIC_KEY }}
        run: |
          if [[ -z "${RELEASE_PROVENANCE_PRIVATE_KEY}" || -z "${RELEASE_PROVENANCE_PUBLIC_KEY}" ]]; then
            echo "RELEASE_PROVENANCE_PRIVATE_KEY and RELEASE_PROVENANCE_PUBLIC_KEY are required" >&2
            exit 1
          fi
          printf '%s' "${RELEASE_PROVENANCE_PRIVATE_KEY}" | \
            go -C module/tools run ./cmd/module-package sign-provenance \
              --module ../ \
              --release "${RUNNER_TEMP}/release" \
              --tag "${GITHUB_REF_NAME}" \
              --commit "${GITHUB_SHA}" \
              --public-key "${RELEASE_PROVENANCE_PUBLIC_KEY}"
      - name: Generate the package SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: module
          format: cyclonedx-json
          artifact-name: module.cdx.json
          output-file: ${{ runner.temp }}/release/module.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Add GitHub's supplemental Sigstore attestation
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/module.tar
      - name: Add the signed provenance bundle to the release assets
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "${PROVENANCE_BUNDLE}" "${RUNNER_TEMP}/release/provenance.sigstore.json"
      - name: Publish the immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GOWORK: "off"
        run: |
          gh attestation verify \
            "${RUNNER_TEMP}/release/module.tar" \
            --repo "${GITHUB_REPOSITORY}"
          draft_created=false
          cleanup_draft() {
            if [[ "${draft_created}" == "true" ]]; then
              gh release delete "${GITHUB_REF_NAME}" --yes
            fi
          }
          trap cleanup_draft EXIT
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --generate-notes
          draft_created=true
          gh release upload "${GITHUB_REF_NAME}" "${RUNNER_TEMP}"/release/*
          git ls-remote --tags origin \
            "refs/tags/${GITHUB_REF_NAME}" \
            "refs/tags/${GITHUB_REF_NAME}^{}" > "${RUNNER_TEMP}/remote-refs-before-publish"
          go -C module/tools run ./cmd/module-package verify-release-ref \
            --module ../ \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --remote-refs "${RUNNER_TEMP}/remote-refs-before-publish"
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          draft_created=false
          gh release verify "${GITHUB_REF_NAME}"

  publish-frontend-kit:
    name: Publish frontend kit to GitHub Packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # Sigstore provenance for the published tarball, matching the module.tar
      # attestation the release already produces.
      id-token: write
      attestations: write
    env:
      # Token that may publish `@codefly-dev`-scoped packages to the codefly-dev org
      # registry, provisioned by the platform infrastructure repository. Exported to every npm step: the
      # scope→GitHub-Packages mapping is job-wide, so any `@codefly/*` the install
      # resolves from the registry (not just the publish) authenticates with it.
      NODE_AUTH_TOKEN: ${{ secrets.CODEFLY_PACKAGES_TOKEN }}
    steps:
      - name: Require the publish token
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "CODEFLY_PACKAGES_TOKEN is required to publish the kit" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # registry-url + scope makes setup-node write the `@codefly-dev` → GitHub
      # Packages mapping and the NODE_AUTH_TOKEN line into a project .npmrc.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: module/services/frontend/code/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@codefly-dev"
      - name: Clean-install frontend dependencies
        run: npm ci --prefix module/services/frontend/code
      - name: Build the kit packages
        run: npm --prefix module/services/frontend/code run build:plugin-packages
      - name: Publish the kit to GitHub Packages
        id: publish
        working-directory: module/services/frontend/code
        run: node scripts/publish-frontend-kit.mjs
      - name: Attest the published tarball provenance
        if: steps.publish.outputs.tarballs != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.publish.outputs.tarballs }}

  handbook-surface-bump:
    name: Announce the release to the functional page
    # The v0.0.x deploy counter is the track a consumer — and the handbook —
    # pins, so it is the tag that makes a new interface current.
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Dispatch surface-bump
        env:
          HANDBOOK_REPOSITORY: ${{ vars.HANDBOOK_REPOSITORY }}
          GH_TOKEN: ${{ secrets.HANDBOOK_DISPATCH_TOKEN }}
        run: node scripts/ci/announce-release.mjs
