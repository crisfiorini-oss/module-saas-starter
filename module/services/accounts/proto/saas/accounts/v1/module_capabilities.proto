syntax = "proto3";

package saas.accounts.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "saas/accounts/v1/module_registration.proto";
import "saas/events/v1/events.proto";
import "saas/jobs/v1/jobs.proto";
import "saas/policy/v1/options.proto";

// ============================================================================
// Module-facing platform capability surface (issue #463)
//
// ModuleCapabilities is the internal-only gRPC surface a sibling module — one
// running on its own database, not able to join the saas-starter transaction —
// uses to reach platform capabilities it would otherwise rebuild: durable job
// enqueue and lease, user notification, approval requests, and typed audit
// emission. The document store is the first consumer.
//
// The surface is EXPOSURE_INTERNAL: it is reached over the accounts internal
// listener behind the cluster-internal token, carrying the caller's
// gateway-forwarded Work Context. The caller is a module service principal with
// a bound tenant and a declared set of queues it may enqueue to and claim from;
// a principal explicitly granted cross-tenant authority may operate on other
// tenants and enqueue global inbox work.
//
// Jobs reuse the saas.jobs.v1 envelope, lease, and lifecycle verbatim. Because
// the caller cannot join the saas transaction, the module producer contract is
// at-least-once with idempotency keys (unlike the in-process producer, which
// commits its outbox row inside the business mutation). Idempotency behaves per
// module/JOBS.md: the (direction, scope, queue, source, idempotency_key) tuple
// is unique and request_fingerprint distinguishes an exact retry (DUPLICATE)
// from conflicting reuse (an idempotency conflict).
//
// NOTE ON PACKAGE: issue #463 proposed package saas.platform.v1. The accounts
// service's code-generation pipeline (service catalog, Connect/gRPC
// registration) is keyed to a single proto package, saas.accounts.v1, and the
// 14 existing EXPOSURE_INTERNAL RPCs already live here. The service is defined
// in saas.accounts.v1 so it flows through that pipeline unchanged; it remains
// the logical module-facing platform surface.
// ============================================================================

// ---------------------------------------------------------------------------
// Jobs
// ---------------------------------------------------------------------------

// ModuleEnqueueJobRequest names the tenant the work belongs to and carries the
// same producer-owned NewJob the in-process producer uses. tenant must equal
// the caller principal's bound tenant unless the principal holds a cross-tenant
// grant; global-scoped (inbox) work additionally requires that grant.
message ModuleEnqueueJobRequest {
  string tenant = 1 [(buf.validate.field).string.uuid = true];
  saas.jobs.v1.NewJob job = 2 [(buf.validate.field).required = true];
}

message ModuleEnqueueJobResponse {
  string job_id = 1 [(buf.validate.field).string.uuid = true];
  saas.jobs.v1.JobEnqueueDisposition disposition = 2 [(buf.validate.field).required = true];
}

// ModuleClaimJobsRequest leases a bounded batch of ready jobs from one queue
// the caller principal is allowed to claim. Claiming is queue-scoped: a queue
// is owned by the module that declares it. The response returns the fencing
// lease on each JobEnvelope; heartbeat and finalization require that token.
message ModuleClaimJobsRequest {
  string queue = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[a-z][a-z0-9_.-]*$"
  }];
  string worker_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  uint32 limit = 3 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 100
  }];
  google.protobuf.Duration lease_duration = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration = {
      gte: {nanos: 1000000}
      lte: {seconds: 3600}
    }
  ];
}

message ModuleClaimJobsResponse {
  repeated saas.jobs.v1.JobEnvelope jobs = 1;
}

message ModuleHeartbeatJobRequest {
  saas.jobs.v1.JobLeaseReference lease = 1 [(buf.validate.field).required = true];
  google.protobuf.Duration extension = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).duration = {
      gte: {nanos: 1000000}
      lte: {seconds: 3600}
    }
  ];
}

message ModuleHeartbeatJobResponse {
  saas.jobs.v1.JobLease lease = 1 [(buf.validate.field).required = true];
}

// ModuleAckJobRequest completes a leased job successfully.
message ModuleAckJobRequest {
  saas.jobs.v1.JobLeaseReference lease = 1 [(buf.validate.field).required = true];
}

// ModuleNackJobRequest fails a leased job. retryable selects a retryable
// failure (rescheduled at retry_at, or dead-lettered when the attempt budget is
// exhausted) versus a permanent failure that dead-letters immediately, matching
// saas.jobs.v1.JobAttemptOutcome.
message ModuleNackJobRequest {
  saas.jobs.v1.JobLeaseReference lease = 1 [(buf.validate.field).required = true];
  saas.jobs.v1.JobFailure failure = 2 [(buf.validate.field).required = true];
  bool retryable = 3;
  google.protobuf.Timestamp retry_at = 4;
}

// ---------------------------------------------------------------------------
// Notifications
// ---------------------------------------------------------------------------

// ModuleNotifyUserRequest routes a notification through the same category
// policy internal callers use (mandatory categories cannot be suppressed;
// optional categories consult the user's settings). idempotency_key dedupes
// redelivery from a module's at-least-once fan-out.
message ModuleNotifyUserRequest {
  string tenant = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  string title = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 998
  }];
  string body = 4 [(buf.validate.field).string.max_len = 8192];
  string type = 5 [(buf.validate.field).string.max_len = 64];
  string action_url = 6 [(buf.validate.field).string.max_len = 2048];
  string category = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
  string idempotency_key = 8 [(buf.validate.field).string.max_len = 255];
}

message ModuleNotifyUserResponse {
  string notification_id = 1;
  // delivered is false when category policy suppressed the notification (an
  // optional category the recipient disabled). The call still succeeds.
  bool delivered = 2;
}

// ---------------------------------------------------------------------------
// Approvals
// ---------------------------------------------------------------------------

// ModuleApprovalPolicy is the non-resume half of the request policy. quorum is
// the number of DISTINCT approve decisions required (0 defaults to 1).
message ModuleApprovalPolicy {
  uint32 quorum = 1 [(buf.validate.field).uint32.lte = 100];
  repeated string approver_set = 2 [(buf.validate.field).repeated.max_items = 100];
  bool allow_self = 3;
}

// ModuleResumeRef is the outbox target the primitive enqueues when the request
// is approved: the requesting module consumes it on its own queue via
// ClaimJobs. topic and payload name the resume work; queue is the module queue
// it lands on.
message ModuleResumeRef {
  string queue = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[a-z][a-z0-9_.-]*$"
  }];
  string topic = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
    pattern: "^[a-z][a-z0-9_.-]*$"
  }];
  google.protobuf.Struct payload = 3;
}

message ModuleRequestApprovalRequest {
  string tenant = 1 [(buf.validate.field).string.uuid = true];
  string resource = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string action = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  google.protobuf.Struct subject = 4;
  string requested_by = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  ModuleApprovalPolicy policy = 6;
  ModuleResumeRef resume_ref = 7 [(buf.validate.field).required = true];
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp escalate_at = 9;
}

message ModuleRequestApprovalResponse {
  string approval_id = 1 [(buf.validate.field).string.uuid = true];
}

message ModuleGetApprovalRequest {
  string tenant = 1 [(buf.validate.field).string.uuid = true];
  string approval_id = 2 [(buf.validate.field).string.uuid = true];
}

// ModuleApproval is the request head as the module sees it.
message ModuleApproval {
  string id = 1;
  string tenant = 2;
  string resource = 3;
  string action = 4;
  google.protobuf.Struct subject = 5;
  string requested_by = 6;
  uint32 quorum = 7;
  string state = 8;
  ModuleResumeRef resume_ref = 9;
  google.protobuf.Timestamp expires_at = 10;
  google.protobuf.Timestamp escalate_at = 11;
  google.protobuf.Timestamp created_at = 12;
}

message ModuleCancelApprovalRequest {
  string tenant = 1 [(buf.validate.field).string.uuid = true];
  string approval_id = 2 [(buf.validate.field).string.uuid = true];
  string reason = 3 [(buf.validate.field).string.max_len = 1024];
}

// ---------------------------------------------------------------------------
// Audit
// ---------------------------------------------------------------------------

// ModuleEmitAuditEventRequest emits a registered audit event onto the tenant's
// single audit spine. event_type must be registered in the code-owned catalog
// (unregistered types are rejected, not stored free-form). solution names the
// emitting solution scope. An empty tenant emits a system-scoped event and
// requires the caller's cross-tenant grant.
message ModuleEmitAuditEventRequest {
  string tenant = 1;
  string event_type = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string actor = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  string solution = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string entry_id = 5 [(buf.validate.field).string.max_len = 255];
  google.protobuf.Struct fields = 6;
  // idempotency_key deduplicates retried emits: two emits with the same
  // (tenant, event_type, idempotency_key) collapse to a single audit row, and
  // the duplicate returns success without writing again. Empty disables
  // deduplication (every emit is a distinct event). Scoped by tenant so one
  // tenant's keys can never suppress another's events.
  string idempotency_key = 7 [(buf.validate.field).string.max_len = 255];
}

// ---------------------------------------------------------------------------
// Datasource blobs
// ---------------------------------------------------------------------------

// FetchDatasourceBlobRequest asks accounts to re-fetch one file blob from the
// upstream provider of a connected datasource, by the source that owns it and
// the blob's content-addressed sha. It is the module's fallback when a compiled
// change set carried a blob sha instead of inline content (a blob past the
// inline cap): the module resolves the bytes here rather than holding a GitHub
// token. Authorization is the caller's module principal (allowed to claim the
// datasource queue) plus the source row's own org and boundary — not the
// request tenant — so no per-blob ticket is needed.
message FetchDatasourceBlobRequest {
  string source_id = 1 [(buf.validate.field).string.uuid = true];
  string blob_sha = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}

// FetchDatasourceBlobChunk is one frame of the streamed blob. total_size and
// content_type are set on every chunk (the stream carries no separate header
// frame) and stay constant across the stream; data is the next slice of bytes.
// A blob past the 25 MiB cap is refused before the first chunk.
message FetchDatasourceBlobChunk {
  bytes data = 1;
  int64 total_size = 2;
  string content_type = 3;
}

// Domain events (pub/sub, issue #493)
// ---------------------------------------------------------------------------

// EventDelivery is the ordering guarantee a subscription requests, mirroring
// events.Delivery in the SDK: UNORDERED fans out with no per-key ordering;
// ORDERED preserves FIFO within an event's partition key.
enum EventDelivery {
  EVENT_DELIVERY_UNSPECIFIED = 0;
  EVENT_DELIVERY_UNORDERED = 1;
  EVENT_DELIVERY_ORDERED = 2;
}

// ModulePublishEventRequest publishes one domain event for the caller's bound
// tenant. The event type's namespace (the segment before the first dot) must be
// one the caller's principal declares. The envelope id is the idempotency key:
// republishing the same id with the identical fact is a no-op, and reusing an
// id for a different fact is rejected.
message ModulePublishEventRequest {
  string tenant = 1 [(buf.validate.field).string.uuid = true];
  saas.events.v1.EventEnvelope envelope = 2 [(buf.validate.field).required = true];
}

message ModulePublishEventResponse {
  // event_id echoes the accepted envelope id — the idempotency key the outbox
  // stored the event of record under. A republish of the same id carrying the
  // identical fact returns the same id and is an accepted no-op; reusing the id
  // for a different fact is rejected with FailedPrecondition.
  string event_id = 1 [(buf.validate.field).string.uuid = true];
}

// ModuleSubscribeRequest creates, or idempotently re-affirms, a durable
// subscription that delivers events matching type_pattern onto queue for the
// calling principal. type_pattern is an exact type or a single trailing ".*"
// prefix. An event type declared with internal visibility is not subscribable
// by a solution principal.
message ModuleSubscribeRequest {
  string type_pattern = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[a-z][a-z0-9]*(?:\\.[a-z0-9]+)*(?:\\.\\*)?$"
  }];
  string queue = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
    pattern: "^[a-z][a-z0-9_.-]*$"
  }];
  EventDelivery delivery = 3;
}

// ModuleSubscription is one durable subscription row as the module sees it.
message ModuleSubscription {
  string id = 1;
  string subscriber_principal_id = 2;
  string type_pattern = 3;
  string queue = 4;
  EventDelivery delivery = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ModuleSubscribeResponse {
  ModuleSubscription subscription = 1;
}

// ModuleUnsubscribeRequest revokes one of the caller's own subscriptions.
message ModuleUnsubscribeRequest {
  string subscription_id = 1 [(buf.validate.field).string.uuid = true];
}

// ModuleListSubscriptionsRequest lists the calling principal's live
// subscriptions. It carries no filter today.
message ModuleListSubscriptionsRequest {}

message ModuleListSubscriptionsResponse {
  repeated ModuleSubscription subscriptions = 1;
}

// ModuleReplayEventsRequest re-delivers durable events of one type for the
// caller's tenant, created at or after since, only to the calling principal's
// own subscriptions. Each redelivery carries a fresh idempotency key so a
// consumer that already acknowledged the event still receives the replay.
message ModuleReplayEventsRequest {
  string tenant = 1 [(buf.validate.field).string.uuid = true];
  string type = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  google.protobuf.Timestamp since = 3;
}

message ModuleReplayEventsResponse {
  // redelivered is the number of durable events re-fanned to the caller's
  // subscriptions.
  int32 redelivered = 1;
}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

// ModuleCapabilitiesService is the module-facing platform surface. Every RPC is
// internal-tier and identifies its caller from the forwarded Work Context —
// except MintModuleRegistration and MintSolutionRegistration, which a registrant
// calls at startup, before any user request exists, and which authorize on the
// registrant's own registration secret.
// Non-secret, current-viewer source read projection.
message ReadableSourceCollection {
  string source_id = 1;
  string boundary_id = 2;
  string origin = 3;
  string container = 4;
  string ref = 5;
  repeated string paths = 6;
}
// Tenant and viewer come exclusively from the verified Work Context.
message ListReadableSourceCollectionsRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  string page_token = 2 [(buf.validate.field).string.max_len = 2048];
}
message ListReadableSourceCollectionsResponse {
  repeated ReadableSourceCollection collections = 1;
  string next_page_token = 2;
}

// ---------------------------------------------------------------------------
// Record placement
// ---------------------------------------------------------------------------

// ModulePlaceRecordRequest binds one of the calling module's own records to a
// node of the tenant's scope tree. Placement is what makes a record resolvable
// at all: CheckAccess and ListAccessibleScopes read a record's true scope from
// its own registered node and accept no caller-supplied path, so a record that
// was never placed is denied to every subject.
//
// resource_type must be one the caller principal's grant declares, which is the
// authority bound: a module places only records governed by the vocabulary its
// composition declared for it, so it can neither introduce a resource type it
// holds no grant for nor re-point another module's records.
message ModulePlaceRecordRequest {
  string tenant = 1 [(buf.validate.field).string.uuid = true];
  // The record's own leaf path, unique within the tenant, whose parent must
  // already be registered. Labels are the lowercase ltree charset, so an opaque
  // id is encoded (lowercase, '-' -> '_') before it is used as one.
  string scope_path = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
    pattern: "^[a-z0-9_]+(?:\\.[a-z0-9_]+)*$"
  }];
  string kind = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string label = 4 [(buf.validate.field).string.max_len = 255];
  string resource_type = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string resource_id = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message ModulePlaceRecordResponse {
  // The scope node the record is placed at. Placing the same record at the same
  // path again is an accepted no-op returning the same id, which is what the
  // surface's at-least-once contract needs; placing it at a different path is
  // refused, because a record resolves through exactly one node and moving it
  // would silently rewrite who can reach it.
  string node_id = 1 [(buf.validate.field).string.uuid = true];
}

service ModuleCapabilitiesService {
  // The forwarded viewer Work Context names the calling module in its audience;
  // this read verifies it carries kind-wide read on a content resource type that
  // module declares, and current owner/actor and collection grants.
  // The internal listener remains mandatory; callers cannot supply identities.
  rpc ListReadableSourceCollections(ListReadableSourceCollectionsRequest) returns (ListReadableSourceCollectionsResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_INTERNAL
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_INTERNAL
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }

  // PlaceRecord places one of the caller's own records at a scope node, so the
  // access oracles can resolve it. Bounded by the resource types the caller
  // principal's grant declares.
  rpc PlaceRecord(ModulePlaceRecordRequest) returns (ModulePlaceRecordResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_INTERNAL
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_INTERNAL
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }

  // EnqueueJob appends durable work for a tenant- or subject-scoped queue.
  rpc EnqueueJob(ModuleEnqueueJobRequest) returns (ModuleEnqueueJobResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_INTERNAL
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_INTERNAL
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }
  // ClaimJobs leases a bounded batch of ready jobs from an allowed queue.
  rpc ClaimJobs(ModuleClaimJobsRequest) returns (ModuleClaimJobsResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_INTERNAL
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_INTERNAL
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }
  // HeartbeatJob renews a live lease by its fencing token.
  rpc HeartbeatJob(ModuleHeartbeatJobRequest) returns (ModuleHeartbeatJobResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_INTERNAL
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_INTERNAL
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }
  // AckJob completes a leased job successfully.
  rpc AckJob(ModuleAckJobRequest) returns (google.protobuf.Empty) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_INTERNAL
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_INTERNAL
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }
  // NackJob fails a leased job as retryable or permanent.
  rpc NackJob(ModuleNackJobRequest) returns (google.protobuf.Empty) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_INTERNAL
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_INTERNAL
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }
  // NotifyUser delivers a notification subject to category policy.
  rpc NotifyUser(ModuleNotifyUserRequest) returns (ModuleNotifyUserResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_INTERNAL
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_INTERNAL
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }
  // RequestApproval opens a pending approval whose resume job the module claims.
  rpc RequestApproval(ModuleRequestApprovalRequest) returns (ModuleRequestApprovalResponse) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_INTERNAL
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_INTERNAL
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }
  // GetApproval returns one approval request on the caller's tenant.
  rpc GetApproval(ModuleGetApprovalRequest) returns (ModuleApproval) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_INTERNAL
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_INTERNAL
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }
  // CancelApproval withdraws a still-open approval request.
  rpc CancelApproval(ModuleCancelApprovalRequest) returns (google.protobuf.Empty) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_INTERNAL
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
      idempotency: IDEMPOTENCY_REQUIREMENT_FORBIDDEN
      rate_limit: RATE_LIMIT_CLASS_INTERNAL
      request_sensitivity: SENSITIVITY_CONFIDENTIAL
      response_sensitivity: SENSITIVITY_CONFIDENTIAL
      platform_role: PLATFORM_ROLE_REQUIREMENT_NONE
    };
  }
  // EmitAuditEvent records a registered audit event on the tenant's spine.
  rpc EmitAuditEvent(ModuleEmitAuditEventRequest) returns (google.protobuf.Empty) {
    option (saas.policy.v1.method_policy) = {
      exposure: EXPOSURE_INTERNAL
      tenant: TENANT_REQUIREMENT_NONE
      mfa: MFA_REQUIREMENT_NONE
      audit: {emission: AUDIT_EMISSION_NONE}
